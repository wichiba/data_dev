<!DOCTYPE html>
<html lang="pt-BR">

<style>

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  button,input,select{font-family:inherit;}
  button:focus-visible,select:focus-visible,input:focus-visible,th[data-sort]:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;box-shadow:0 0 0 1.5px var(--ink);}

  .topbar{background:var(--ink);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}

  .logo{height:30px;width:auto;display:block;}
  .logo-badge{height:30px;min-width:42px;padding:0 8px;border-radius:15px;background:var(--yellow);color:#2D3277;display:inline-flex;align-items:center;justify-content:center;font-family:var(--heading);font-weight:900;font-size:14px;letter-spacing:-.02em;}
  .topbar-right{font-size:12.5px;color:var(--yellow);font-weight:600;}
  .wrap{max-width:1380px;margin:0 auto;padding:0 28px 90px;}

  header.hero{padding:38px 0 6px;}

  .lede{font-size:15.5px;color:var(--ink-soft);max-width:760px;line-height:1.55;margin:0;}
  .gen-note{font-size:11.5px;color:#a7a59a;margin-top:14px;font-family:var(--mono);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:26px 0 20px;}
  .tabs{display:inline-flex;flex-wrap:wrap;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px;gap:2px;}
  .tabs button{font-family:var(--heading);font-weight:700;font-size:13.5px;padding:9px 20px;border:none;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;}

  .meta-pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
  .meta-pill strong{font-family:var(--heading);font-weight:900;font-size:15px;color:var(--ink);background:var(--yellow);padding:4px 11px;border-radius:999px;}
  .tabpanel[hidden]{display:none;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;}
  .card{background:#fff;border:1.5px solid var(--line);border-left-width:5px;border-radius:14px;padding:20px 22px;text-align:left;font:inherit;color:inherit;display:block;width:100%;}
  button.card{cursor:pointer;transition:transform .15s,border-color .15s;} button.card:hover{transform:translateY(-2px);border-color:var(--ink);}
  button.card.ok:hover{border-left-color:var(--ok);} button.card.bad:hover{border-left-color:var(--caution);}

  .card.total{background:var(--ink);color:#fff;border-color:var(--ink);border-left-color:var(--yellow);}
  .card .lab{font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:500;}
  .card.total .lab{color:#c9c8c0;}
  .card .num{font-family:var(--heading);font-weight:900;font-size:clamp(36px,4.4vw,52px);line-height:1;letter-spacing:-.025em;font-variant-numeric:tabular-nums;}
  .card.total .num{color:var(--yellow);} .card.ok .num{color:var(--ok);} .card.bad .num{color:var(--caution);}
  .card .row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12.5px;color:var(--ink-soft);}
  .card.total .row{color:#c9c8c0;}

  .badge.okb{background:var(--ok-bg);color:#14532d;border:1.5px solid var(--ok);padding:3.5px 9px;}

  .key-dot{width:12px;height:12px;border-radius:3px;background:var(--yellow);border:1.5px solid var(--ink);display:inline-block;}

  .tw{overflow:auto;height:78vh;min-height:360px;background:#fff;border:1.5px solid var(--line);border-radius:12px;}
  table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;}

  table.dt th[data-sort]{cursor:pointer;} table.dt th[data-sort]:hover{background:var(--yellow);color:var(--ink);}

  .t-bad{color:var(--caution);} .t-ok{color:var(--ok);}
  .pg-bar{height:7px;border-radius:99px;background:#fff;border:1.5px solid var(--ink);overflow:hidden;}
  .pg-bar i{display:block;height:100%;background:var(--yellow);border-radius:99px;transform-origin:left;}
  .pg-bar.hit{border-color:var(--ok);} .pg-bar.hit i{background:var(--ok);}
  .pg-bar.none{border-color:var(--line);background:var(--paper);}
  .intro .pg-bar i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;}
  .intro .split-bar i{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;}

  .empty{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}

  .goals{margin-top:16px;padding-top:6px;border-top:1px solid var(--line);}
  .goal{display:grid;grid-template-columns:minmax(230px,auto) 1fr auto;gap:14px;align-items:center;margin-top:10px;font-size:12.5px;}
  .goal .gl{color:var(--ink);font-weight:500;} .goal .gn{color:var(--ink-soft);white-space:nowrap;} .goal .gn b{font-family:var(--mono);color:var(--ink);}
  .gbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;} .gbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transform-origin:left;}
  .intro .gbar i{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;}
  @media(max-width:720px){.goal{grid-template-columns:1fr;gap:4px;}}
  @media(max-width:720px){.wrap{padding:0 16px 70px;}.topbar{padding:12px 16px;}.ghost{margin-left:0;}}
  @media(prefers-reduced-motion:reduce){.intro .pg-bar i,.intro .split-bar i,.intro .gbar i{animation:none;}button.card{transition:none;}}
</style>

<script>
const D = <?!= dadosJson ?>;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nInt = n => n.toLocaleString('pt-BR');
const nDec = (n, d=2) => n.toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const nBRL = n => n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const nPct = (n, d=1) => nDec(n, d) + '%';
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- configuração das abas
const TABS = {

    cols:[

      {i:10, label:'Assessor', orig:'ASSESSOR', type:'txt'},
      {i:4, label:'Atingimento da meta (%)', orig:'ATINGIMENTO_VS_META', type:'prog', key:true},
      {i:5, label:'Meta batida?', orig:'FLAG_META_BATIDA', type:'flag', key:true, yes:'Meta batida', no:'Não batida'},
      {i:1, label:'Investimento médio (jan–set/26)', orig:'MEDIA_INVESTIMENTO_JAN_SET_2026', type:'brl'},
      {i:7, label:'Meta de investimento (R$)', orig:'META_INVESTIMENTO_2026', type:'brl'},
      {i:2, label:'Investimento (out–nov/26)', orig:'INVESTIMENTO_OUT_NOV_2026', type:'brl'},
      {i:3, label:'Variação out–nov/26 vs. média jan–set/26', orig:'VARIACAO_OUT_NOV_2026_VS_MEDIA_JAN_SET_2026', type:'pct'},
      {i:6, label:'Crescimento out–nov/25 vs. média jan–set/25', orig:'CRESCIMENTO_OUT_NOV_2025_VS_MEDIA_JAN_SET_2025', type:'pct'}
    ]
  },

    searchIdx:[0,6,7,8],
    cols:[
      {i:0, label:'Seller ID', orig:'SELLER_ID', type:'id'},
      {i:6, label:'Nome Seller', orig:'NOME_SELLER', type:'txt'},
      {i:7, label:'CNPJ', orig:'CNPJ', type:'txt'},
      {i:8, label:'Assessor', orig:'ASSESSOR', type:'txt'},
      {i:9, label:'Total de itens KMIs', orig:'TOTAL_ITENS_KMIS', type:'int'},
      {i:4, label:'Atingimento da meta (%)', orig:'ATINGIMENTO_VS_META', type:'prog', key:true},
      {i:5, label:'Meta atingida?', orig:'FLAG_META_BATIDA', type:'flag', key:true, yes:'Meta atingida', no:'Não atingida'},
      {i:1, label:'Total de itens', orig:'TOTAL_ITENS', type:'int'},
      {i:2, label:'Itens com 5% de comissão', orig:'ITENS_COM_5_COMISSAO', type:'int'},
      {i:3, label:'% de itens com 5% de comissão', orig:'ITENS_COM_5_DE_COMISSAO_PCT', type:'pct2'}
    ]
  },
  mp: {
    id:'mp', title:'Minha Página', meta:100, rows:D.mp || [],
    metaText:'Metas: cupons válidos e produtos em oferta relâmpago', metaBadge:'2 cupons · 6 produtos',
    idx:{flag:5, ating:3},
    subtitle:'Todos os sellers de Minha Página, com o atingimento da meta de cupons válidos e da meta de produtos em oferta relâmpago.',
    searchPh:'Buscar por Seller ID, nome ou assessor',
    searchIdx:[0,6,7,8],
    hitLabel:'Bateram as duas metas', missLabel:'Não bateram as duas metas', noMiss:true,
    goals:[
      {label:'Meta de cupons válidos', i:3},
      {label:'Meta de produtos oferta relâmpago', i:4}
    ],
    cols:[
      {i:0, label:'Seller ID', orig:'SELLER_ID', type:'id'},
      {i:6, label:'Nome Seller', orig:'NOME_SELLER', type:'txt'},
      {i:7, label:'CNPJ', orig:'CNPJ', type:'txt'},
      {i:8, label:'Assessor', orig:'ASSESSOR', type:'txt'},

      {i:2, label:'Produtos oferta relâmpago', orig:'produtos_relampago', type:'int'}
    ]
  },
  acc: {
  id: 'acc',
  title: 'Acompanhamento Assessores',
  meta: 100,
  rows: D.acomp || [],
  metaText: '',
  metaBadge: '',
  idx: { flag: 5, ating: 5 },
  subtitle: 'Acompanhamento do desempenho por assessor.',
  totalLabel: 'Total de assessores',
  unit: 'assessores',
  unitOne: 'assessor',
  searchPh: 'Buscar por nome do assessor',
  hitLabel: '',
  missLabel: '',

  hideGoalSummary: true,
  goals: [],
  cols: [
    { i: 0, label: 'Assessor', orig: 'NOME', type: 'txt' },
    { i: 1, label: 'Sellers assessorados', orig: 'QTD SELLERS', type: 'int' },
    { i: 2, label: 'Sellers já trabalhados', orig: 'ENGAJAMENTO', type: 'txt' },
    { i: 3, label: 'Meta', orig: 'META', type: 'txt' },
    { i: 4, label: 'Quantidade que bateu a meta', orig: 'QUANTOS BATERAM A META', type: 'int' },
    { i: 5, label: 'Atingimento', orig: 'ATINGIMENTO', type: 'prog' }
    ]
}
};

// ---------------------------------------------------------------- células
function progCell(t, v){
  if(v === null || v === undefined || v === '') return '<td class="prog key"><div class="pg-top"><strong class="mut">–</strong></div><div class="pg-bar none"></div></td>';
  const value = typeof v === 'number' ? v : Number(String(v).replace('%', '').replace(',', '.'));
  if(!Number.isFinite(value)) return '<td class="prog key"><div class="pg-top"><strong class="mut">–</strong></div><div class="pg-bar none"></div></td>';
  const ratio = (t.id === 'acc' && String(v).includes('%')) ? value / 100 : value;
  const pct = ratio * 100;
  const hit = ratio >= 1;
  const fill = Math.max(0, Math.min(1, ratio));
  const shownPct = hit ? pct : Math.min(99.99, pct);
  const miss = (hit || t.noMiss) ? '' : 'Faltam '+nDec(Math.max(0.01, 100 - shownPct))+' p.p.';
  return '<td class="prog key"><div class="pg-top"><strong class="'+(hit?'t-ok':'t-bad')+'">'+nDec(shownPct)+'%</strong><span>'+miss+'</span></div>'+
         '<div class="pg-bar'+(hit?' hit':'')+'" role="img" aria-label="'+nDec(shownPct)+'% da meta"><i style="width:'+(fill*100).toFixed(2)+'%"></i></div></td>';
}
function cell(t, c, row){
  const v = row[c.i], k = c.key ? ' key' : '';
  const vazio = v === null || v === undefined || v === '';
  switch(c.type){
    case 'id':   return '<td class="l">'+esc(v)+'</td>';
    case 'txt':  return vazio ? '<td class="mut l">–</td>' : '<td class="l">'+esc(typeof v==='number' ? nDec(v) : v)+'</td>';
    case 'prog': return progCell(t, v);
    case 'flag': return '<td class="'+k.trim()+'"><span class="badge sm '+(v===true?'okb':'warnb')+'">'+(v===true?c.yes:c.no)+'</span></td>';
    case 'brl':  return vazio ? '<td class="mut">–</td>' : '<td>'+nBRL(v)+'</td>';
    case 'pct':  return vazio ? '<td class="mut">–</td>' : '<td>'+nPct(v,2)+'</td>';
    case 'pct2': return vazio ? '<td class="mut">–</td>' : '<td>'+nPct(v*100,2)+'</td>';
    case 'int':  return vazio ? '<td class="mut">–</td>' : '<td>'+nInt(v)+'</td>';
  }
  return '<td>'+esc(v)+'</td>';
}

// ---------------------------------------------------------------- montagem de cada aba
function countUp(el, to, ms){
  if(reduceMotion || to < 2){ el.textContent = nInt(to); return; }
  const t0 = performance.now();
  (function step(now){
    const p = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - p, 3);
    el.textContent = nInt(Math.round(to * e));
    if(p < 1) requestAnimationFrame(step);
  })(t0);
}

const ROW_H = 40;

function build(t){
  const root = $('panel-'+t.id);
  const flagI = t.idx.flag;
  const unit = t.unit || 'sellers';
  const total = t.rows.length;
  const hit = t.rows.reduce((s, r) => s + (r[flagI] === true ? 1 : 0), 0);
  const miss = total - hit;
  const pHit = total ? hit/total*100 : 0, pMiss = total ? miss/total*100 : 0;
  t.state = {q:'', status:'all', sortCol:t.cols.findIndex(c => c.type==='prog'), sortDir:-1, view:t.rows};
  const ph = t.searchPh || 'Buscar por Seller ID';

  const goalsHtml = (!t.goals || !t.goals.length) ? '' : '<div class="goals">'+t.goals.map(g => {
    const n = t.rows.reduce((s, r) => s + (r[g.i] !== null && r[g.i] >= 1 ? 1 : 0), 0), p = total ? n/total*100 : 0;
    return '<div class="goal"><span class="gl">'+esc(g.label)+'</span><div class="gbar" role="img" aria-label="'+nPct(p)+' bateram"><i style="width:'+p.toFixed(2)+'%"></i></div><span class="gn"><b>'+nInt(n)+'</b> bateram · '+nPct(p)+'</span></div>';
  }).join('')+'</div>';

  const summaryHtml = t.hideGoalSummary
    ? '<div class="cards"><div class="card total"><div class="lab">Total de assessores</div><div class="num" data-to="'+total+'">0</div><div class="row">Assessores na base de acompanhamento</div></div></div>'
    : '<div class="cards">'+
        '<button type="button" class="card total" data-status="all"><div class="lab">'+esc(t.totalLabel || 'Total de sellers')+'</div><div class="num" data-to="'+total+'">0</div><div class="row"><span class="badge y sm">100%</span> da base total</div></button>'+
        '<button type="button" class="card ok" data-status="hit"><div class="lab">'+esc(t.hitLabel || 'Bateram a meta')+'</div><div class="num" data-to="'+hit+'">0</div><div class="row"><span class="badge okb">'+nPct(pHit)+'</span> dos '+unit+'</div></button>'+
        '<button type="button" class="card bad" data-status="miss"><div class="lab">'+esc(t.missLabel || 'Não bateram a meta')+'</div><div class="num" data-to="'+miss+'">0</div><div class="row"><span class="badge warnb">'+nPct(pMiss)+'</span> dos '+unit+'</div></button>'+
      '</div>'+
      '<div class="split"><div class="split-top"><span><b>'+nInt(hit)+'</b> bateram · <b>'+nInt(miss)+'</b> não bateram</span><span>Toque em um card para filtrar a tabela</span></div>'+
        '<div class="split-bar" role="img" aria-label="'+nPct(pHit)+' bateram a meta e '+nPct(pMiss)+' não bateram"><i class="s-ok" style="width:calc('+pHit.toFixed(3)+'% - 1px)"></i><i class="s-bad" style="width:calc('+pMiss.toFixed(3)+'% - 1px)"></i></div>'+goalsHtml+'</div>';

  root.innerHTML = summaryHtml +
    '<div class="panel">'+
      '<div class="panel-head"><div><h2>Dados por '+esc(t.unitOne || 'seller')+'</h2><p>'+esc(t.subtitle)+'</p></div></div>'+
      '<div class="controls">'+
        '<div class="search"><input type="text" autocomplete="off" placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'"></div>'+
        (t.hideGoalSummary ? '' : '<div class="quick" role="group" aria-label="Filtrar por status">'+
          '<button type="button" data-status="all">Todos</button><button type="button" data-status="hit">Bateram</button><button type="button" data-status="miss">Não bateram</button>'+
        '</div>')+
        '<button type="button" class="ghost" data-export>Exportar CSV</button>'+
      '</div>'+
      (t.hideGoalSummary
        ? '<div class="legend"><span><i class="key-dot"></i>Dados de acompanhamento dos assessores</span><span><i class="lg y"></i>Atingimento informado na planilha</span></div>'
        : '<div class="legend"><span><i class="key-dot"></i>Colunas principais</span><span><i class="lg y"></i>Progresso até a meta</span><span><i class="lg g"></i>Meta batida</span><span>Barra cheia = meta atingida (100%)</span></div>')+
      '<div class="tw" tabindex="0" aria-label="Lista"><table class="dt"><thead><tr>'+
        t.cols.map((c,n) => '<th data-sort="'+n+'" tabindex="0" class="'+((c.type==='id'||c.type==='txt')?'l ':'')+(c.key?'key':'')+'" title="Coluna original: '+esc(c.orig)+'" aria-sort="none">'+esc(c.label)+'<span class="ar"></span></th>').join('')+
      '</tr></thead><tbody></tbody></table></div>'+
      '<div class="foot"><span class="range"></span><span>Role a lista para ver todos os '+unit+'</span></div>'+
    '</div>';

  root.querySelectorAll('.num').forEach(el => countUp(el, +el.dataset.to, 900));

  const q = root.querySelector('.search input');
  let tm; q.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { t.state.q = q.value.trim(); refresh(t); }, 160); });
  root.addEventListener('click', e => {
    const s = e.target.closest('[data-status]'); if(s){ t.state.status = s.dataset.status; refresh(t); if(s.classList.contains('card')) root.querySelector('.panel').scrollIntoView({behavior: reduceMotion?'auto':'smooth', block:'start'}); return; }
    if(e.target.closest('[data-export]')) { exportCsv(t); return; }
    const th = e.target.closest('th[data-sort]'); if(th) sortBy(t, +th.dataset.sort);
  });
  root.addEventListener('keydown', e => { const th = e.target.closest('th[data-sort]'); if(th && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); sortBy(t, +th.dataset.sort); } });
  let raf = 0;
  root.querySelector('.tw').addEventListener('scroll', () => { if(!raf) raf = requestAnimationFrame(() => { raf = 0; renderWindow(t); }); });
  refresh(t);
}

function sortBy(t, n){
  const st = t.state, ty = t.cols[n].type;
  if(st.sortCol === n) st.sortDir = -st.sortDir; else { st.sortCol = n; st.sortDir = (ty==='id' || ty==='txt') ? 1 : -1; }
  refresh(t);
}

function refresh(t){
  const st = t.state, fI = t.idx.flag;
  let v = t.rows;
  if(st.status !== 'all') v = v.filter(r => st.status==='hit' ? r[fI] === true : r[fI] !== true);
  if(st.q){ const qq = st.q.toLocaleLowerCase('pt-BR'); const campos = t.searchIdx || [0]; v = v.filter(r => campos.some(i => String(r[i] ?? '').toLocaleLowerCase('pt-BR').includes(qq))); }
  if(st.sortCol !== null && st.sortCol >= 0){
    const c = t.cols[st.sortCol], i = c.i, dir = st.sortDir, isId = c.type==='id';
    v = v.slice().sort((a, b) => {
      let x = a[i], y = b[i];
      const nx = (x === null || x === undefined || x === ''), ny = (y === null || y === undefined || y === '');
      if(nx && ny) return 0; if(nx) return 1; if(ny) return -1;
      if(isId){ x = +x; y = +y; }
      else if(typeof x === 'boolean'){ x = +x; y = +y; }
      else if(typeof x === 'string' || typeof y === 'string') return String(x).localeCompare(String(y), 'pt-BR') * dir;
      return x === y ? 0 : (x < y ? -dir : dir);
    });
  }
  st.view = v;
  const root = $('panel-'+t.id);
  root.querySelectorAll('.quick button[data-status]').forEach(b => b.classList.toggle('on', b.dataset.status === st.status));
  root.querySelectorAll('thead th').forEach((th, n) => {
    const on = st.sortCol === n;
    th.setAttribute('aria-sort', on ? (st.sortDir===1 ? 'ascending' : 'descending') : 'none');
    th.querySelector('.ar').textContent = on ? (st.sortDir===1 ? '▲' : '▼') : '';
  });
  root.querySelector('.range').textContent = nInt(v.length)+' de '+nInt(t.rows.length)+' '+(t.unit || 'sellers')+' na lista';
  root.querySelector('.tw').scrollTop = 0;
  renderWindow(t);
}

function renderWindow(t){
  const st = t.state, root = $('panel-'+t.id), box = root.querySelector('.tw'), tb = root.querySelector('tbody');
  const n = st.view.length, cols = t.cols.length;
  if(!n){ tb.innerHTML = '<tr><td colspan="'+cols+'" class="empty" style="text-align:center;font-family:var(--body);height:auto;padding:36px 20px">Nenhum resultado encontrado. Ajuste a busca ou o filtro de status.</td></tr>'; return; }
  const vh = box.clientHeight || 600;
  const first = Math.max(0, Math.floor(box.scrollTop / ROW_H) - 8);
  const last = Math.min(n, first + Math.ceil(vh / ROW_H) + 16);
  const sp = h => h > 0 ? '<tr class="sp" aria-hidden="true" style="height:'+h+'px"><td colspan="'+cols+'" style="height:'+h+'px"></td></tr>' : '';
  let html = sp(first * ROW_H);
  for(let i = first; i < last; i++){ const r = st.view[i]; html += '<tr>'+t.cols.map(c => cell(t, c, r)).join('')+'</tr>'; }
  tb.innerHTML = html + sp((n - last) * ROW_H);
}

function exportCsv(t){
  const num = v => (v === null || v === undefined) ? '' : (typeof v === 'boolean' ? (v ? 'Sim' : 'Não') : String(v).replace('.', ','));
  const txt = v => '"'+String(v === null || v === undefined ? '' : v).replace(/"/g,'""')+'"';
  const head = t.cols.map(c => txt(c.label)).join(';');
  const lines = t.rows.map(r => t.cols.map(c => {
    const v = r[c.i];
    if(c.type==='id') return v;
    if(c.type==='txt') return txt(v);
    if(c.type==='flag') return v===true ? 'Sim' : 'Não';
    if(c.type==='pct') return num(v===null ? null : Math.round(v*1e6)/1e8);
    return num(v);
  }).join(';'));
  const blob = new Blob(['﻿' + head + '\n' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'gamification_bf2026_'+t.id+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------------------------------------------------------------- abas
function show(id){
  Object.keys(TABS).forEach(k => {
    const on = k === id;
    $('tab-'+k).setAttribute('aria-selected', on);
    $('panel-'+k).hidden = !on;
  });
  const t = TABS[id];
  $('meta-pill').innerHTML = id === 'acc' ? '' :
  '<span>'+esc(t.metaText)+'</span><strong>'+esc(t.metaBadge || (t.meta+'%'))+'</strong>';
  if(t.state) renderWindow(t);
}
Object.keys(TABS).forEach(k => $('tab-'+k).addEventListener('click', () => show(k)));
document.querySelector('.tabs').addEventListener('keydown', e => {
  if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const ks = Object.keys(TABS), cur = ks.findIndex(k => $('tab-'+k).getAttribute('aria-selected')==='true');
  const nx = ks[(cur + (e.key==='ArrowRight' ? 1 : -1) + ks.length) % ks.length]; show(nx); $('tab-'+nx).focus();
});

$('gen-note').textContent = '';
Object.values(TABS).forEach(build);
show('cp');
document.body.classList.add('intro');
setTimeout(() => document.body.classList.remove('intro'), 1400);
</script>
